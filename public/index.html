<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKRP Verification</title>
    <link rel="icon" type="image/png" href="/logo-website.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Canvas Background */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(0, 255, 136, 0.6);
            border-radius: 20px;
            padding: 40px 50px;
            box-shadow: 
                0 0 20px rgba(0, 255, 136, 0.4),
                0 0 40px rgba(0, 255, 136, 0.2),
                0 0 60px rgba(0, 255, 136, 0.1),
                inset 0 0 30px rgba(0, 255, 136, 0.05);
            backdrop-filter: blur(10px);
            animation: cardGlow 2s ease-in-out infinite alternate;
        }

        @keyframes cardGlow {
            0% {
                box-shadow: 
                    0 0 20px rgba(0, 255, 136, 0.4),
                    0 0 40px rgba(0, 255, 136, 0.2),
                    0 0 60px rgba(0, 255, 136, 0.1),
                    inset 0 0 30px rgba(0, 255, 136, 0.05);
                border-color: rgba(0, 255, 136, 0.6);
            }
            100% {
                box-shadow: 
                    0 0 30px rgba(0, 255, 136, 0.6),
                    0 0 60px rgba(0, 255, 136, 0.4),
                    0 0 90px rgba(0, 255, 136, 0.2),
                    inset 0 0 40px rgba(0, 255, 136, 0.1);
                border-color: rgba(0, 255, 136, 0.9);
            }
        }

        .logo {
            width: 150px;
            height: 150px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5), 0 0 40px rgba(0, 255, 136, 0.3);
            border: 3px solid rgba(0, 255, 136, 0.6);
            object-fit: cover;
            animation: logoGlow 2s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            0% {
                box-shadow: 0 0 20px rgba(0, 255, 136, 0.5), 0 0 40px rgba(0, 255, 136, 0.3);
            }
            100% {
                box-shadow: 0 0 30px rgba(0, 255, 136, 0.7), 0 0 60px rgba(0, 255, 136, 0.5);
            }
        }

        .title {
            color: #00ff88;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.8), 0 0 20px rgba(0, 255, 136, 0.6), 0 0 30px rgba(0, 255, 136, 0.4);
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            0% {
                text-shadow: 0 0 10px rgba(0, 255, 136, 0.8), 0 0 20px rgba(0, 255, 136, 0.6), 0 0 30px rgba(0, 255, 136, 0.4);
            }
            100% {
                text-shadow: 0 0 15px rgba(0, 255, 136, 1), 0 0 30px rgba(0, 255, 136, 0.8), 0 0 45px rgba(0, 255, 136, 0.6);
            }
        }

        .verify-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #000;
            font-size: 18px;
            font-weight: 600;
            padding: 15px 60px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6), 0 0 40px rgba(0, 255, 136, 0.4), 0 0 60px rgba(0, 255, 136, 0.2);
            animation: btnGlow 2s ease-in-out infinite alternate;
        }

        @keyframes btnGlow {
            0% {
                box-shadow: 0 0 20px rgba(0, 255, 136, 0.6), 0 0 40px rgba(0, 255, 136, 0.4), 0 0 60px rgba(0, 255, 136, 0.2);
            }
            100% {
                box-shadow: 0 0 30px rgba(0, 255, 136, 0.8), 0 0 60px rgba(0, 255, 136, 0.6), 0 0 90px rgba(0, 255, 136, 0.4);
            }
        }

        .verify-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 40px rgba(0, 255, 136, 1), 0 0 80px rgba(0, 255, 136, 0.8), 0 0 120px rgba(0, 255, 136, 0.6);
            background: linear-gradient(135deg, #00ff99 0%, #00dd77 100%);
        }

        .verify-btn:active {
            transform: translateY(0);
        }

        .verify-btn svg {
            width: 24px;
            height: 24px;
        }

        .footer {
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        /* Status Messages */
        .status-message {
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .status-success {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid rgba(0, 255, 136, 0.5);
            color: #00ff88;
        }

        .status-error {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid rgba(255, 68, 68, 0.5);
            color: #ff4444;
        }

        .status-info {
            background: rgba(88, 101, 242, 0.2);
            border: 1px solid rgba(88, 101, 242, 0.5);
            color: #5865f2;
        }

        /* IP Tracker Popup */
        .ip-tracker {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(255, 0, 100, 0.6);
            border-radius: 15px;
            padding: 15px 20px;
            max-width: 300px;
            z-index: 100;
            box-shadow: 0 0 20px rgba(255, 0, 100, 0.4), 0 0 40px rgba(255, 0, 100, 0.2);
            animation: trackerGlow 2s ease-in-out infinite alternate;
            display: none;
        }

        .ip-tracker.show {
            display: block;
        }

        @keyframes trackerGlow {
            0% { box-shadow: 0 0 20px rgba(255, 0, 100, 0.4), 0 0 40px rgba(255, 0, 100, 0.2); }
            100% { box-shadow: 0 0 30px rgba(255, 0, 100, 0.6), 0 0 60px rgba(255, 0, 100, 0.3); }
        }

        .ip-tracker-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: #ff0064;
            font-weight: 600;
            font-size: 14px;
        }

        .ip-tracker-header svg {
            width: 18px;
            height: 18px;
        }

        .ip-tracker-count {
            background: rgba(255, 0, 100, 0.3);
            color: #ff0064;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: auto;
        }

        .ip-tracker-list {
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
        }

        .ip-tracker-list::-webkit-scrollbar {
            width: 4px;
        }

        .ip-tracker-list::-webkit-scrollbar-thumb {
            background: rgba(255, 0, 100, 0.5);
            border-radius: 2px;
        }

        .ip-tracker-item {
            padding: 8px 10px;
            background: rgba(255, 0, 100, 0.1);
            border-radius: 8px;
            margin-bottom: 5px;
            font-size: 13px;
            color: #fff;
        }

        .ip-tracker-item:last-child {
            margin-bottom: 0;
        }

        .ip-tracker-name {
            font-weight: 600;
            color: #ff6699;
        }

        .ip-tracker-id {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 30px 25px;
                margin: 20px;
            }
            
            .logo {
                width: 120px;
                height: 120px;
            }
            
            .title {
                font-size: 22px;
            }
            
            .verify-btn {
                padding: 12px 40px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Particles Canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- IP Tracker Popup -->
    <div class="ip-tracker" id="ip-tracker">
        <div class="ip-tracker-header">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
            <span>⚠️ IP Terdeteksi</span>
            <span class="ip-tracker-count" id="ip-count">0</span>
        </div>
        <ul class="ip-tracker-list" id="ip-list"></ul>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="card">
            <div id="status-container"></div>
            
            <img src="/logo-website.png" alt="CKRP Logo" class="logo">
            
            <h1 class="title">CKRP Verification</h1>
            
            <a href="/auth/discord" class="verify-btn" id="verify-btn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
                VERIFY
            </a>
            
            <p class="footer">Powered by Discord OAuth2</p>
        </div>
    </div>

    <script>
        // Check URL parameters for status
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');
        const error = urlParams.get('error');
        const guild = urlParams.get('guild');

        const statusContainer = document.getElementById('status-container');
        const verifyBtn = document.getElementById('verify-btn');

        if (status === 'success') {
            statusContainer.innerHTML = '<div class="status-message status-success">✅ Verifikasi berhasil! Silakan cek Discord kamu.</div>';
            verifyBtn.style.display = 'none';
        } else if (status === 'already_verified') {
            statusContainer.innerHTML = '<div class="status-message status-info">ℹ️ Kamu sudah pernah verifikasi sebelumnya.</div>';
            verifyBtn.style.display = 'none';
        } else if (error) {
            let errorMessage = 'Terjadi kesalahan. Silakan coba lagi.';
            if (error === 'no_code') errorMessage = 'Kode otorisasi tidak ditemukan.';
            if (error === 'oauth_failed') errorMessage = 'Gagal melakukan verifikasi. Silakan coba lagi.';
            if (error === 'no_guild') errorMessage = 'Server tidak ditemukan. Silakan klik tombol dari Discord.';
            
            statusContainer.innerHTML = `<div class="status-message status-error">❌ ${errorMessage}</div>`;
        }

        // Add guild to verify link if present
        if (guild) {
            verifyBtn.href = `/auth/discord?guild=${guild}`;
        }

        // Clean URL
        if (status || error) {
            window.history.replaceState({}, document.title, window.location.pathname + (guild ? `?guild=${guild}` : ''));
        }

        // Optimized Particles Animation
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d', { alpha: true });

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 120;
        const connectionDistance = 100;
        const connectionDistanceSq = connectionDistance * connectionDistance;
        const colors = ['#00ff88', '#00ffcc', '#ff00ff', '#00ffff', '#ff6600'];

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 2.5 + 1.5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0) { this.x = 0; this.vx *= -1; }
                else if (this.x > width) { this.x = width; this.vx *= -1; }
                if (this.y < 0) { this.y = 0; this.vy *= -1; }
                else if (this.y > height) { this.y = height; this.vy *= -1; }
            }
        }

        function init() {
            particles.length = 0;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Update all particles
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
            }

            // Draw connections first (no shadow for performance)
            ctx.shadowBlur = 0;
            for (let i = 0; i < particles.length; i++) {
                const p1 = particles[i];
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const distSq = dx * dx + dy * dy;

                    if (distSq < connectionDistanceSq) {
                        const opacity = (1 - distSq / connectionDistanceSq) * 0.35;
                        ctx.strokeStyle = `rgba(0, 255, 180, ${opacity})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }

            // Draw particles with glow
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = p.color;
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }, 100);
        });

        init();
        animate();

        // Check IP for duplicate accounts
        async function checkIP() {
            try {
                const response = await fetch('/api/check-ip');
                const data = await response.json();
                
                if (data.found && data.count > 0) {
                    const tracker = document.getElementById('ip-tracker');
                    const countEl = document.getElementById('ip-count');
                    const listEl = document.getElementById('ip-list');
                    
                    countEl.textContent = data.count + ' akun';
                    listEl.innerHTML = data.accounts.map(acc => `
                        <li class="ip-tracker-item">
                            <div class="ip-tracker-name">${acc.globalName || acc.username}</div>
                            <div class="ip-tracker-id">@${acc.username}</div>
                        </li>
                    `).join('');
                    
                    tracker.classList.add('show');
                }
            } catch (err) {
                console.log('IP check failed:', err);
            }
        }
        
        checkIP();
    </script>
</body>
</html>
